services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tapestry}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tapestry}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    image: pgc-images.sbgenomics.com/rokita-lab/tapestry:latest
    platform: linux/amd64
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-tapestry}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command: bash -c "pip list && echo '---' && Rscript -e 'installed.packages()[,1]' && echo '---' && python3 -c \"import psycopg, os; conn = psycopg.connect(host=os.getenv('POSTGRES_HOST','localhost'), dbname=os.getenv('POSTGRES_DB','tapestry'), user=os.getenv('POSTGRES_USER','postgres'), password=os.getenv('POSTGRES_PASSWORD','postgres')); print(conn.execute('SELECT version()').fetchone()[0])\""
    volumes:
      - .:/app
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
